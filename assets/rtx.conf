# Object anti-culling: keep game-culled instances alive so occluded objects
# still contribute GI/shadows. No light anti-culling — the proxy resubmits
# every engine light each frame, and letting Remix hoard stale light
# instances saturates its light pool (lights stop rendering entirely).
rtx.antiCulling.object.enable = True
rtx.antiCulling.object.numObjectsToKeep = 10000
rtx.antiCulling.object.enableInfinityFarFrustum = True
rtx.antiCulling.object.fovScale = 1.15
rtx.antiCulling.light.enable = False

rtx.orthographicIsUI = True

# Emitter radius for D3D9 fixed-function lights ([Lights] Mode=ffp). Must match
# the proxy INI's EmitterRadius — the proxy's Range encoding assumes it.
rtx.lightConversionSphereLightFixedRadius = 0.4

# The runtime's enabled-FFP-light slot table defaults to 8; every LightEnable
# beyond 8 concurrent lights silently no-ops. Sized to the engine light table.
d3d9.maxEnabledLights = 768

# Vertex capture: worldrep vertices carry engine lightmap luminance as diffuse
# color; treat it as baked lighting so designed-dark areas stay dark.
rtx.useVertexCapture = True
rtx.useVertexCapturedNormals = True
rtx.useWorldMatricesForShaders = True
rtx.vertexColorIsBakedLighting = True
rtx.ignoreAllVertexColorBakedLighting = False

rtx.legacyMaterial.metallicConstant = 0.1
rtx.opaqueMaterial.metallicScale = 1
rtx.opaqueMaterial.metallicBias = 0
rtx.opaqueMaterial.roughnessScale = 1

# Tonemapping: local tonemapper, no auto-exposure (fights stealth darkness).
rtx.autoExposure.enabled = False
rtx.tonemap.exposureBias = 0
rtx.tonemappingMode = 1
rtx.localtonemap.exposure = 6
rtx.localtonemap.shadows = 2
rtx.localtonemap.highlights = 4
rtx.localtonemap.mip = 3
rtx.localtonemap.displayMip = 0
rtx.localtonemap.useGaussian = True
rtx.localtonemap.boostLocalContrast = False
rtx.localtonemap.ditherMode = 2
rtx.localtonemap.finalizeWithACES = True
rtx.localtonemap.exposurePreferenceOffset = 0
rtx.localtonemap.exposurePreferenceSigma = 4
